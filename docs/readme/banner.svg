<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">NOTE-APP</title>
  <desc id="d">Bannière animée : le titre NOTE-APP en dégradé animé, entouré de cartes de notes qui flottent.</desc>
  <defs>
    <!-- Même dégradé que le titre h1 des notes (theme.css) -->
    <linearGradient id="titre" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#4fc1ff"/>
      <stop offset="0.2" stop-color="#c586c0"/>
      <stop offset="0.4" stop-color="#ce9178"/>
      <stop offset="0.6" stop-color="#6a9955"/>
      <stop offset="0.8" stop-color="#dcdcaa"/>
      <stop offset="1" stop-color="#4fc1ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="960 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grille" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <style>
      .carte { animation: flotte 6s ease-in-out infinite; }
      .c2 { animation-delay: -2s; }
      .c3 { animation-delay: -4s; }
      @keyframes flotte { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .sous-titre { opacity: 0; animation: apparait 1.2s ease-out 0.4s forwards; }
      @keyframes apparait { to { opacity: 1; } }
      .curseur { animation: clignote 1.1s steps(1) infinite; }
      @keyframes clignote { 50% { opacity: 0; } }
      .ligne { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.9; } }
      @media (prefers-reduced-motion: reduce) {
        .carte, .curseur, .ligne { animation: none; }
        .sous-titre { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="960" height="300" rx="16" fill="#1e1e1e"/>
  <rect width="960" height="300" rx="16" fill="url(#grille)"/>

  <!-- Cartes de notes (bloc .step du design system : bordure gauche colorée) -->
  <g class="carte">
    <rect x="44" y="70" width="170" height="104" rx="8" fill="#2d2d30" stroke="#3e3e42"/>
    <rect x="44" y="70" width="4" height="104" rx="2" fill="#4fc1ff"/>
    <rect class="ligne" x="62" y="88" width="96" height="9" rx="4" fill="#4fc1ff"/>
    <rect x="62" y="108" width="132" height="6" rx="3" fill="#9d9d9d" opacity="0.5"/>
    <rect x="62" y="122" width="118" height="6" rx="3" fill="#9d9d9d" opacity="0.5"/>
    <rect x="62" y="136" width="126" height="6" rx="3" fill="#9d9d9d" opacity="0.5"/>
    <rect x="62" y="150" width="70" height="6" rx="3" fill="#9d9d9d" opacity="0.5"/>
  </g>
  <g class="carte c2">
    <rect x="746" y="54" width="170" height="92" rx="8" fill="#2d2d30" stroke="#3e3e42"/>
    <rect x="746" y="54" width="4" height="92" rx="2" fill="#c586c0"/>
    <rect class="ligne" x="764" y="72" width="80" height="9" rx="4" fill="#c586c0"/>
    <rect x="764" y="92" width="134" height="6" rx="3" fill="#9d9d9d" opacity="0.5"/>
    <rect x="764" y="106" width="112" height="6" rx="3" fill="#9d9d9d" opacity="0.5"/>
    <rect x="764" y="120" width="90" height="6" rx="3" fill="#9d9d9d" opacity="0.5"/>
  </g>
  <g class="carte c3">
    <rect x="770" y="170" width="146" height="78" rx="8" fill="#2d2d30" stroke="#3e3e42"/>
    <rect x="770" y="170" width="4" height="78" rx="2" fill="#6a9955"/>
    <rect class="ligne" x="788" y="186" width="64" height="9" rx="4" fill="#6a9955"/>
    <rect x="788" y="206" width="110" height="6" rx="3" fill="#9d9d9d" opacity="0.5"/>
    <rect x="788" y="220" width="84" height="6" rx="3" fill="#9d9d9d" opacity="0.5"/>
  </g>

  <!-- Titre et sous-titre -->
  <text x="480" y="148" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="76" font-weight="800" letter-spacing="2" fill="url(#titre)">NOTE-APP</text>
  <text class="sous-titre" x="480" y="196" text-anchor="middle" font-family="Georgia, Cambria, serif" font-style="italic" font-size="21" fill="#d4d4d4">Vos notes. Vos fichiers. Votre machine.</text>
  <rect class="curseur" x="676" y="180" width="2.5" height="21" fill="#d4d4d4"/>
  <text x="480" y="244" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#9d9d9d" letter-spacing="1">HTML · MARKDOWN · PDF · LOCAL · WINDOWS 11</text>
</svg>
